name: Test Update Functionality

on:
  workflow_run:
    workflows: ["Release Packages"]
    types:
      - completed
  workflow_dispatch:

jobs:
  get-versions:
    name: Extract Release Versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      prev_version: ${{ steps.versions.outputs.PREV_VERSION }}
      new_version: ${{ steps.versions.outputs.NEW_VERSION }}
      skip: ${{ steps.versions.outputs.SKIP }}
    steps:
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Get versions
        id: versions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          AUTH_HEADER=""
          if [ -n "$GITHUB_TOKEN" ]; then
            AUTH_HEADER="Authorization: Bearer $GITHUB_TOKEN"
          fi

          LATEST=$(curl -s -H "$AUTH_HEADER" https://api.github.com/repos/${{ github.repository }}/releases/latest \
            | jq -r '.tag_name' | sed 's/^v//')

          PREVIOUS=$(curl -s -H "$AUTH_HEADER" "https://api.github.com/repos/${{ github.repository }}/releases?per_page=2" \
            | jq -r '.[1].tag_name' | sed 's/^v//')

          if [ -z "$PREVIOUS" ] || [ -z "$LATEST" ] || [ "$PREVIOUS" = "null" ] || [ "$LATEST" = "null" ]; then
            echo "⚠️ Fewer than 2 releases found, skipping update tests"
            echo "LATEST: $LATEST"
            echo "PREVIOUS: $PREVIOUS"
            echo "SKIP=true" >> $GITHUB_OUTPUT
            echo "PREV_VERSION=" >> $GITHUB_OUTPUT
            echo "NEW_VERSION=" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "SKIP=false" >> $GITHUB_OUTPUT
          echo "PREV_VERSION=$PREVIOUS" >> $GITHUB_OUTPUT
          echo "NEW_VERSION=$LATEST" >> $GITHUB_OUTPUT
          echo "✓ Detected versions - Previous: v$PREVIOUS, Latest: v$LATEST"

  test-deb-update:
    name: Test .deb Package Update
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: get-versions
    if: ${{ needs.get-versions.outputs.skip != 'true' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}

    steps:
      - name: Display test versions
        run: |
          echo "Testing update from v${{ needs.get-versions.outputs.prev_version }} to v${{ needs.get-versions.outputs.new_version }}"

      - name: Download previous version .deb
        run: |
          echo "📥 Downloading previous version v${{ needs.get-versions.outputs.prev_version }}"
          curl -L -o sticks-old.deb \
            "https://github.com/${{ github.repository }}/releases/download/v${{ needs.get-versions.outputs.prev_version }}/sticks_${{ needs.get-versions.outputs.prev_version }}-1_amd64.deb"

          if [ ! -f sticks-old.deb ]; then
            echo "❌ Failed to download previous version"
            exit 1
          fi

          ls -lh sticks-old.deb

      - name: Install previous version
        run: |
          echo "📦 Installing previous version v${{ needs.get-versions.outputs.prev_version }}"
          sudo dpkg -i sticks-old.deb || sudo apt-get install -f -y

          echo "✓ Verifying installation"
          which sticks
          sticks --version

      - name: Verify previous version
        run: |
          VERSION_OUTPUT=$(sticks --version)
          echo "Installed version: $VERSION_OUTPUT"

          if echo "$VERSION_OUTPUT" | grep -q "${{ needs.get-versions.outputs.prev_version }}"; then
            echo "✓ Previous version installed correctly"
          else
            echo "❌ Version mismatch!"
            exit 1
          fi

      - name: Test update command
        run: |
          echo "🔄 Testing update from v${{ needs.get-versions.outputs.prev_version }} to v${{ needs.get-versions.outputs.new_version }}"
          echo "NOTE: automatic in-place replacement is disabled; sticks must refuse and print reinstall guidance."

          set +e
          sticks update > /tmp/update.log 2>&1
          UPDATE_EXIT=$?
          set -e

          cat /tmp/update.log

          if [ "$UPDATE_EXIT" = "0" ]; then
            echo "❌ Expected 'sticks update' to refuse automatic .deb replacement (non-zero exit)"
            exit 1
          fi

          if grep -qiE "cannot verify|\.deb|distribution package manager|verify the package" /tmp/update.log; then
            echo "✓ Update correctly refused with reinstall guidance"
          else
            echo "❌ Update output did not contain expected reinstall guidance"
            exit 1
          fi

          sleep 2

          echo "✓ Verifying installed version is unchanged (no destructive replace)"
          sticks --version

      - name: Verify version unchanged
        run: |
          VERSION_OUTPUT=$(sticks --version)
          echo "Version after update attempt: $VERSION_OUTPUT"

          if echo "$VERSION_OUTPUT" | grep -q "${{ needs.get-versions.outputs.prev_version }}"; then
            echo "✅ Correctly still on v${{ needs.get-versions.outputs.prev_version }} (no unverified replace)"
          else
            echo "❌ Version changed unexpectedly!"
            exit 1
          fi

      - name: Test basic functionality after update
        run: |
          echo "🧪 Testing basic functionality"

          rm -rf /tmp/test-project-deb
          mkdir -p /tmp/test-project-deb
          cd /tmp/test-project-deb

          echo "Creating test project..."
          sticks c test_app

          if [ -d "test_app" ]; then
            echo "✅ Project creation works after update"
          else
            echo "❌ Project creation failed"
            exit 1
          fi

  test-cargo-update:
    name: Test Cargo Install Update
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: get-versions
    if: ${{ needs.get-versions.outputs.skip != 'true' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}

    steps:
      - name: Display test versions
        run: |
          echo "Testing cargo install update from v${{ needs.get-versions.outputs.prev_version }} to v${{ needs.get-versions.outputs.new_version }}"

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable

      - name: Install previous version via cargo
        run: |
          echo "📥 Installing previous version v${{ needs.get-versions.outputs.prev_version }} via cargo"
          cargo install sticks --version ${{ needs.get-versions.outputs.prev_version }} --force

      - name: Verify previous version
        run: |
          VERSION_OUTPUT=$(sticks --version)
          echo "Installed version: $VERSION_OUTPUT"

          if echo "$VERSION_OUTPUT" | grep -q "${{ needs.get-versions.outputs.prev_version }}"; then
            echo "✓ Previous version installed correctly via cargo"
          else
            echo "❌ Version mismatch!"
            exit 1
          fi

      - name: Test update command
        run: |
          echo "🔄 Testing cargo-based update from v${{ needs.get-versions.outputs.prev_version }} to v${{ needs.get-versions.outputs.new_version }}"
          echo "NOTE: cargo installs print 'cargo install --force' guidance and exit 0 without changing the binary."

          set +e
          sticks update > /tmp/update.log 2>&1
          UPDATE_EXIT=$?
          set -e

          cat /tmp/update.log

          if [ "$UPDATE_EXIT" != "0" ]; then
            echo "❌ Expected 'sticks update' to succeed with cargo guidance (exit 0)"
            exit 1
          fi

          if grep -q "cargo install sticks --force" /tmp/update.log; then
            echo "✓ Update printed cargo reinstall guidance"
          else
            echo "❌ Update output did not contain 'cargo install sticks --force'"
            exit 1
          fi

          sleep 2

          echo "✓ Verifying version is unchanged (guidance only, no auto-replace)"
          sticks --version

      - name: Verify version unchanged
        run: |
          VERSION_OUTPUT=$(sticks --version)
          echo "Version after update attempt: $VERSION_OUTPUT"

          if echo "$VERSION_OUTPUT" | grep -q "${{ needs.get-versions.outputs.prev_version }}"; then
            echo "✅ Correctly still on v${{ needs.get-versions.outputs.prev_version }}"
          else
            echo "❌ Version changed unexpectedly!"
            exit 1
          fi

      - name: Test basic functionality after update
        run: |
          echo "🧪 Testing basic functionality"

          rm -rf /tmp/test-project-cargo
          mkdir -p /tmp/test-project-cargo
          cd /tmp/test-project-cargo

          echo "Creating test project..."
          sticks c test_app

          if [ -d "test_app" ]; then
            echo "✅ Project creation works after update"
          else
            echo "❌ Project creation failed"
            exit 1
          fi

  test-binary-update:
    name: Test Binary Update
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: get-versions
    if: ${{ needs.get-versions.outputs.skip != 'true' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}

    steps:
      - name: Display test versions
        run: |
          echo "Testing binary update from v${{ needs.get-versions.outputs.prev_version }} to v${{ needs.get-versions.outputs.new_version }}"

      - name: Download previous version binary
        run: |
          echo "📥 Downloading previous version v${{ needs.get-versions.outputs.prev_version }}"
          curl -L -o sticks-old \
            "https://github.com/${{ github.repository }}/releases/download/v${{ needs.get-versions.outputs.prev_version }}/sticks-linux-x86_64"

          chmod +x sticks-old

          if [ ! -f sticks-old ]; then
            echo "❌ Failed to download previous version"
            exit 1
          fi

          ls -lh sticks-old

      - name: Install previous version
        run: |
          echo "📦 Installing previous version v${{ needs.get-versions.outputs.prev_version }}"
          mkdir -p ~/.local/bin
          mv sticks-old ~/.local/bin/sticks
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Verify previous version
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          VERSION_OUTPUT=$(sticks --version)
          echo "Installed version: $VERSION_OUTPUT"

          if echo "$VERSION_OUTPUT" | grep -q "${{ needs.get-versions.outputs.prev_version }}"; then
            echo "✓ Previous version installed correctly"
          else
            echo "❌ Version mismatch!"
            exit 1
          fi

      - name: Test update command
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          echo "🔄 Testing verified binary update from v${{ needs.get-versions.outputs.prev_version }} to v${{ needs.get-versions.outputs.new_version }}"

          sticks update > /tmp/update.log 2>&1
          UPDATE_EXIT=$?

          cat /tmp/update.log

          if [ "$UPDATE_EXIT" != "0" ]; then
            echo "❌ Expected 'sticks update' to succeed with checksum-verified replacement"
            exit 1
          fi

          if grep -q "Updated sticks to v${{ needs.get-versions.outputs.new_version }}" /tmp/update.log; then
            echo "✓ Update completed with verified artifact"
          else
            echo "❌ Update output did not confirm the new version"
            exit 1
          fi

          sleep 2

      - name: Verify version updated
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          VERSION_OUTPUT=$(sticks --version)
          echo "Version after update: $VERSION_OUTPUT"

          if echo "$VERSION_OUTPUT" | grep -q "${{ needs.get-versions.outputs.new_version }}"; then
            echo "✅ Updated to v${{ needs.get-versions.outputs.new_version }}"
          else
            echo "❌ Version did not change to the latest release!"
            exit 1
          fi

      - name: Test basic functionality after update
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          echo "🧪 Testing basic functionality"

          rm -rf /tmp/test-project-binary
          mkdir -p /tmp/test-project-binary
          cd /tmp/test-project-binary

          echo "Creating test project..."
          sticks c test_app

          if [ -d "test_app" ]; then
            echo "✅ Project creation works after update"
          else
            echo "❌ Project creation failed"
            exit 1
          fi

  update-test-summary:
    name: Update Test Summary
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [get-versions, test-deb-update, test-cargo-update, test-binary-update]
    if: always()

    steps:
      - name: Check test results
        run: |
          echo "## Update Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.get-versions.outputs.skip }}" = "true" ]; then
            echo "⏭️ Fewer than 2 releases found, update tests skipped." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          if [ "${{ needs.test-deb-update.result }}" = "success" ]; then
            echo "✅ .deb package update: PASSED" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.test-deb-update.result }}" = "skipped" ]; then
            echo "⏭️ .deb package update: SKIPPED" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ .deb package update: FAILED" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.test-cargo-update.result }}" = "success" ]; then
            echo "✅ Cargo install update: PASSED" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.test-cargo-update.result }}" = "skipped" ]; then
            echo "⏭️ Cargo install update: SKIPPED" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Cargo install update: FAILED" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.test-binary-update.result }}" = "success" ]; then
            echo "✅ Binary update: PASSED" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.test-binary-update.result }}" = "skipped" ]; then
            echo "⏭️ Binary update: SKIPPED" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Binary update: FAILED" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.test-deb-update.result }}" = "success" ] && \
             [ "${{ needs.test-cargo-update.result }}" = "success" ] && \
             [ "${{ needs.test-binary-update.result }}" = "success" ]; then
            echo "🎉 All update tests passed successfully!" >> $GITHUB_STEP_SUMMARY
            exit 0
          else
            echo "⚠️ Some update tests failed. Please review the logs above." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
