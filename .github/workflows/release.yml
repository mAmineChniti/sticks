name: Release Packages

on:
  push:
    branches:
      - master
    paths:
      - 'Cargo.toml'
  release:
    types: [created]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check-version:
    name: Check Version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      should_release: ${{ steps.check.outputs.SHOULD_RELEASE }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Get version from Cargo.toml
        id: version
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)
          # Strip anything that could inject a second output line.
          echo "VERSION=${VERSION//$'\n'/}" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}

      - name: Check if tag exists
        id: check
        run: |
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "SHOULD_RELEASE=false" >> "$GITHUB_OUTPUT"
            echo "Tag v$VERSION already exists"
          else
            echo "SHOULD_RELEASE=true" >> "$GITHUB_OUTPUT"
            echo "Tag v$VERSION does not exist, will create release"
          fi
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true' || github.event_name == 'release'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable

      - name: Run tests
        run: cargo test --verbose

  publish-crate:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: [check-version, test]
    if: needs.check-version.outputs.should_release == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable

      - name: Publish to crates.io
        # A failure here must fail the job: silently swallowing it makes the
        # maintainer believe a version shipped when it did not.
        run: cargo publish --locked --token "$CARGO_REGISTRY_TOKEN"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  build-deb:
    name: Build Debian Package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [check-version, test]
    if: needs.check-version.outputs.should_release == 'true' || github.event_name == 'release'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked --version 3.8.0

      - name: Build release binary
        run: cargo build --release --verbose

      - name: Build .deb package
        run: cargo deb

      # The .deb is attached by the `release` job. Attaching it here would
      # publish against whatever tag this run computed, which is wrong when
      # the workflow was triggered by a `release:` event for another tag.
      - name: Upload .deb package
        uses: actions/upload-artifact@v7
        with:
          name: sticks-deb
          path: target/debian/*.deb

  build-binary:
    name: Build Generic Linux Binary
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [check-version, test]
    if: needs.check-version.outputs.should_release == 'true' || github.event_name == 'release'
    strategy:
      matrix:
        target: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu, armv7-unknown-linux-gnueabihf]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          cache: false

      - name: Install cross-compilation tools
        if: matrix.target != 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf

      - name: Configure linker for cross-compilation
        if: matrix.target != 'x86_64-unknown-linux-gnu'
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          elif [ "${{ matrix.target }}" = "armv7-unknown-linux-gnueabihf" ]; then
            echo "CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER=arm-linux-gnueabihf-gcc" >> $GITHUB_ENV
          fi

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Strip binary
        run: |
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-gnu" ]; then
            strip target/${{ matrix.target }}/release/sticks
          elif [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            aarch64-linux-gnu-strip target/${{ matrix.target }}/release/sticks
          elif [ "${{ matrix.target }}" = "armv7-unknown-linux-gnueabihf" ]; then
            arm-linux-gnueabihf-strip target/${{ matrix.target }}/release/sticks
          fi

      - name: Rename binary
        run: |
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-gnu" ]; then
            cp target/${{ matrix.target }}/release/sticks sticks-linux-x86_64
          elif [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            cp target/${{ matrix.target }}/release/sticks sticks-linux-aarch64
          elif [ "${{ matrix.target }}" = "armv7-unknown-linux-gnueabihf" ]; then
            cp target/${{ matrix.target }}/release/sticks sticks-linux-armv7
          fi
          chmod +x sticks-linux-*

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: sticks-linux-${{ matrix.target }}
          path: sticks-linux-*

  build-windows:
    name: Build Windows Binary
    runs-on: windows-latest
    permissions:
      contents: read
    needs: [check-version, test]
    if: needs.check-version.outputs.should_release == 'true' || github.event_name == 'release'
    strategy:
      matrix:
        target: [x86_64-pc-windows-msvc, aarch64-pc-windows-msvc]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          cache: false

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary
        run: |
          if [ "${{ matrix.target }}" = "x86_64-pc-windows-msvc" ]; then
            cp target/${{ matrix.target }}/release/sticks.exe sticks-windows-x86_64.exe
          elif [ "${{ matrix.target }}" = "aarch64-pc-windows-msvc" ]; then
            cp target/${{ matrix.target }}/release/sticks.exe sticks-windows-aarch64.exe
          fi
        shell: bash

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: sticks-windows-${{ matrix.target }}
          path: sticks-windows-*.exe

  build-macos:
    name: Build macOS Binary
    runs-on: macos-latest
    permissions:
      contents: read
    needs: [check-version, test]
    if: needs.check-version.outputs.should_release == 'true' || github.event_name == 'release'
    strategy:
      matrix:
        target: [x86_64-apple-darwin, aarch64-apple-darwin]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          cache: false

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary
        run: |
          if [ "${{ matrix.target }}" = "x86_64-apple-darwin" ]; then
            cp target/${{ matrix.target }}/release/sticks sticks-macos-x86_64
          elif [ "${{ matrix.target }}" = "aarch64-apple-darwin" ]; then
            cp target/${{ matrix.target }}/release/sticks sticks-macos-aarch64
          fi
          chmod +x sticks-macos-*

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: sticks-macos-${{ matrix.target }}
          path: sticks-macos-*

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [check-version, test, build-deb, build-binary, build-windows, build-macos]
    if: needs.check-version.outputs.should_release == 'true' || github.event_name == 'release'
    permissions:
      contents: write
    steps:
      # Needed only to create the release tag; credentials are persisted so the
      # push below can authenticate without putting a token in a remote URL.
      - uses: actions/checkout@v7
        if: github.event_name != 'release' && needs.check-version.outputs.should_release == 'true'
        with:
          fetch-depth: 0

      - name: Download Linux artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: sticks-linux-*
          path: ./artifacts

      - name: Download Windows artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: sticks-windows-*
          path: ./artifacts

      - name: Download macOS artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: sticks-macos-*
          path: ./artifacts

      - name: Download Debian artifact
        uses: actions/download-artifact@v7
        with:
          name: sticks-deb
          path: ./artifacts

      - name: Generate checksums
        run: |
          cd ./artifacts
          find . -type f ! -name 'SHA256SUMS' -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS
          cat SHA256SUMS

      # The tag and the public release are created only now: every job above
      # (including the test suite) has already succeeded.
      - name: Create Git Tag
        if: github.event_name != 'release' && needs.check-version.outputs.should_release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"
        env:
          VERSION: ${{ needs.check-version.outputs.version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'release' && github.event.release.tag_name || format('v{0}', needs.check-version.outputs.version) }}
          name: Release ${{ github.event_name == 'release' && github.event.release.tag_name || format('v{0}', needs.check-version.outputs.version) }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ./artifacts/**/*
            ./artifacts/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
