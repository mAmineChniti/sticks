[package]
name = "sticks"
authors = ["mAmineChniti"]
description = "A tool for managing C and C++ projects"
license = "MIT"
version = "0.5.0"
edition = "2024"
readme = "README.md"
repository = "https://github.com/mAmineChniti/sticks"
documentation = "https://docs.rs/sticks"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4", features = ["derive"] }
clap_complete = "4.5.46"
clap_mangen = "0.2.31"
dirs = "6.0"
libc = "0.2"
regex = "1.12.4"
serde_json = "1.0.150"
sha2 = "0.10"
similar = "=2.7.0"
strsim = "0.11.1"

[dev-dependencies]
serial_test = "3.3"
tempfile = "3.27.0"

[[bin]]
name="sticks"
path="src/main.rs"

[package.metadata.deb]
name = "sticks"
maintainer = "mAmineChniti <emin.chniti@esprit.tn>"
copyright = "2023-2025 mAmineChniti <emin.chniti@esprit.tn>"
license-file = ["LICENSE", "0"]
depends = "$auto, gcc"
extended-description = """\
Sticks is a Rust command-line tool for managing C and C++ projects. 
It simplifies the process of creating new projects and managing dependencies 
in your Makefile with modern build practices."""
section = "devel"
priority = "optional"
assets = [
    ["target/release/sticks", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/sticks/", "644"],
    ["LICENSE", "usr/share/doc/sticks/", "644"],
]
